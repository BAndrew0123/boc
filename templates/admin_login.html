{% extends 'base.html' %}

{% block title %}Admin Portal Login | Body of Christ Centre{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200 shadow-xl p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-slate-900 text-brand rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900">Admin Portal Login</h2>
            <p class="text-xs text-slate-500">Sign in to manage donations, events, children projects, and website content.</p>
        </div>

        <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 uppercase mb-1">Username</label>
                <input type="text" name="username" required value="admin" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand text-sm font-semibold">
            </div>

            <div>
                <label class="block font-bold text-slate-700 uppercase mb-1">Password</label>
                <input type="password" name="password" required value="admin123" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand text-sm">
            </div>

            <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-amber-900 text-[11px] leading-relaxed">
                <strong>Default Demo Credentials:</strong><br>
                Username: <code class="font-bold">admin</code> | Password: <code class="font-bold">admin123</code>
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-brand text-white font-extrabold py-3.5 rounded-xl shadow transition text-sm">
                LOG IN TO DASHBOARD
            </button>
        </form>
    </div>
</div>
{% endblock %}
